name: orderflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: orderflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orderflow_admin
      POSTGRES_PASSWORD: orderflow_secret
      POSTGRES_DB: orderflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow_admin -d orderflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orderflow-net

  redis:
    image: redis:7.2-alpine
    container_name: orderflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orderflow-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: orderflow-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Web Management Dashboard
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orderflow-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: orderflow-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"     # Web UI
      - "1025:1025"     # SMTP Server
    networks:
      - orderflow-net

networks:
  orderflow-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
